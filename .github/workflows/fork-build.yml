name: fork-build

on:
  push:
    branches: ["**"]
    tags: ["fork-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cli:
    name: Linux CLI build and focused tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Cache Cargo downloads and build output
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            codex-rs/target
          key: fork-build-linux-${{ hashFiles('codex-rs/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Run focused CLI and core tests
        run: |
          # Keep this fork gate deterministic: daemon and sandbox integration
          # scenarios require host capabilities not available on GitHub runners.
          cargo test -p codex-cli --lib
          # Exercise the recursive core residency group with its required stack
          # size. The upstream project owns the exhaustive core-suite gate.
          RUST_MIN_STACK=33554432 cargo test -p codex-core --lib \
            agent::control::residency::tests
      - name: Assemble Codex package
        working-directory: .
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          # Produce the same package layout the official standalone installer
          # ships (bin/codex, bin/codex-code-mode-host, codex-path/rg,
          # codex-resources/bwrap, codex-package.json) so the daemon's
          # package validation passes.
          python3 scripts/build_codex_package.py \
            --target x86_64-unknown-linux-gnu \
            --cargo-profile release \
            --rg-bin "$(command -v rg)" \
            --force \
            --archive-output "$RUNNER_TEMP/codex-package-x86_64-unknown-linux-gnu.tar.gz"
      - name: Smoke test package archive
        run: |
          smoke_dir="$(mktemp -d)"
          tar --extract --gzip --file "$RUNNER_TEMP/codex-package-x86_64-unknown-linux-gnu.tar.gz" -C "$smoke_dir"
          "$smoke_dir/bin/codex" --version
      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/codex-package-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest fork release
        if: github.event_name == 'push' && github.repository == 'madbrain76/codex' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=fork-latest
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "$RUNNER_TEMP/codex-package-x86_64-unknown-linux-gnu.tar.gz" \
            --title "Fork latest (${GITHUB_SHA::12})" \
            --notes "Built by the passing fork-build workflow from ${GITHUB_SHA}." \
            --latest
