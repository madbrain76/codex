name: fork-build

on:
  push:
    branches: ["**"]
    tags: ["fork-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cli:
    name: Linux CLI build and focused tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Cache Cargo downloads and build output
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            codex-rs/target
          key: fork-build-linux-${{ hashFiles('codex-rs/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Run focused CLI and core tests
        run: |
          # Three integration tests require capabilities unavailable on GitHub-hosted
          # runners: bubblewrap's user namespace, replacing a running binary, and
          # deterministic bootstrap timing for the background daemon.
          cargo test -p codex-cli -- \
            --skip sandbox_fetches_and_enforces_cloud_managed_permission_profile \
            --skip daemon_handoff_uses_selected_executable_and_propagates_failure \
            --skip packaged_daemon_bootstrap_seeds_local_package \
            --skip restart_applies_saved_updater_preference
          # Recursive residency tests need a larger stack. Run core tests
          # serially so the hosted runner does not allocate that stack per CPU.
          RUST_MIN_STACK=33554432 cargo test -p codex-core -- \
            --test-threads=1 \
            --skip session::turn::tests::post_sampling_token_estimate_is_disabled_by_always_on_sinks
      - name: Build release CLI
        run: cargo build --release -p codex-cli --bin codex
      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-x86_64-${{ github.sha }}
          path: codex-rs/target/release/codex
          if-no-files-found: error
          retention-days: 14
